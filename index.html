<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="Creative & Celtic Wood Art Website">
    <meta name="author" content="AWilNol">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative & Celtic Home</title>
    <link rel="stylesheet" type="text/css" href="./css/logo.css">
    <link rel="stylesheet" type="text/css" href="./css/style.css">
  </head>
    <body>
        <div class="container">
           <div class="content-wrapper">
              <a href="./about.html" class="logo-link">
               <img src="./images/logo.gif" alt="logo" width="280px" height="280px">
              </a>
              <p class="tagline">A Wood Art Synergy</p>
              <p class="tagline">Custom Home Decor</p>
              <div class="social-links-home"> <!-- Renamed class to avoid conflict -->
                <a href="https://www.facebook.com"><img src="./images/facebook.png" alt="facebook link" width="40" height="40"></a>
                <a href="https://www.zazzle.com"><img src="./images/zazzle-logo.png" alt="zazzle link" width="40" height="40"></a>
              </div>
         </div>
    </div>
	<script>
  document.addEventListener('click', function(e) {
    const ripple = document.createElement('div');
    ripple.classList.add('ripple');
    document.body.appendChild(ripple);

    // Position the ripple where the click occurred
    ripple.style.left = `${e.clientX}px`;
    ripple.style.top = `${e.clientY}px`;

    // Remove the element after the animation finishes to keep the code clean
    ripple.onanimationend = () => {
      ripple.remove();
    };
  });
</script>
  </body>
</html>
