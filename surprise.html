<!DOCTYPE html>
<html lang="en-US">
  <head>
  	<meta charset="utf-8">
    <meta name="description" content="A fun surprise from Creative & Celtic">
    <meta name="author" content="AWilNol">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative & Celtic Surprise</title>
    
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
  </head>
     <body>
	   <div id="sparkle-container"></div>
      <div class="surprise-container">
     	<h2 class="about-subtitle">Hello! I hope this finds you very well, and thank you for visiting!!</h2>
        <hr class="gold-hr"> 
        <p class="center-text">
          <a href="./about.html"><img src="./images/relax.jpg" alt="a bit of fun" class="fun-image"></a>
        </p>
        <hr class="gold-hr">
	  
	    <footer>
          <p>© 2025, Creative & Celtic</p>
        </footer>
      </div>
	  <script src="./js/cursor-effects.js?v=1.1"></script>
	  <script>
  // 1. Cursor Sparkles (MOUSEMOVE)
  document.addEventListener('mousemove', (e) => {
    const container = document.getElementById('sparkle-container');
    if (!container) return;
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = `${e.clientX}px`;
    sparkle.style.top = `${e.clientY}px`;
    const size = Math.random() * 5 + 2;
    sparkle.style.width = sparkle.style.height = `${size}px`;
    container.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 800);
  });

  // 2. Logo Ripple (MOUSEDOWN - Fixes the double-click bug)
  const logoLinks = document.querySelectorAll('.logo-link');
  logoLinks.forEach(link => {
    link.addEventListener('mousedown', function(e) {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = this.getBoundingClientRect();
      ripple.style.left = `${e.clientX - rect.left}px`;
      ripple.style.top = `${e.clientY - rect.top}px`;
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
      // link will navigate naturally on the subsequent 'click' event
    });
  });
</script>
     </body>
</html>
